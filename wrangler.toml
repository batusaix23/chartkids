name = "chartkids-api"
main = "worker.js"
compatibility_date = "2024-09-23"

# Workers AI binding (used for /actividad and chat endpoints)
[[ai]]
binding = "AI"

# KV Namespace binding
# Run:  npx wrangler kv:namespace create "CHARTKIDS_DATA"
# Then replace the id below with the one it prints
[[kv_namespaces]]
binding = "DATA"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Custom route: routes all /api/* requests on chartkids.com to this Worker
# Requires the chartkids.com zone to be on Cloudflare (it already is)
# After deploying, add this route in Cloudflare Dashboard:
#   Workers > chartkids-api > Triggers > Routes → chartkids.com/api/*
[[routes]]
pattern = "chartkids.com/api/*"
zone_name = "chartkids.com"

# Environment variables — set these in Cloudflare Dashboard
# Workers > chartkids-api > Settings > Variables & Secrets:
#   ADMIN_KEY      → your secret admin key
#   PAYPAL_CLIENT_ID
#   PAYPAL_SECRET
