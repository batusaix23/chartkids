<rect x="40" y="216" width="736" height="70" rx="14" fill="#f59e0b18" stroke="#f59e0b" stroke-width="2"/><text x="70" y="264" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif" font-size="38">🎯</text><text x="122" y="244" font-family="'Nunito',Arial,sans-serif" font-size="14" font-weight="800" fill="#f59e0b" letter-spacing="1">INGENIERÍA</text><text x="122" y="268" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="800" fill="#1e293b">¿Qué tan lejos puedes lanzar un pompón?</text><text x="40" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#f59e0b">MATERIALES</text><text x="418" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#f59e0b">PASOS</text><rect x="40" y="325" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">7 palitos de paleta</text><rect x="40" y="352" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="367" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Ligas</text><rect x="40" y="379" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="394" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Una tapa de botella</text><rect x="40" y="406" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="421" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Pompones</text><rect x="40" y="433" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="448" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Pegamento</text><circle cx="428" cy="335" r="11" fill="#f59e0b"/><text x="428" y="340" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">1</text><text x="448" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Junta 5 palitos con ligas en las</text><text x="448" y="359" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">puntas.</text><circle cx="428" cy="383" r="11" fill="#f59e0b"/><text x="428" y="388" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">2</text><text x="448" y="388" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Junta 2 palitos solo de una</text><text x="448" y="407" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">punta.</text><circle cx="428" cy="431" r="11" fill="#f59e0b"/><text x="428" y="436" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">3</text><text x="448" y="436" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Mete el grupo de 5 entre los 2 y</text><text x="448" y="455" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">asegúralo con ligas.</text><circle cx="428" cy="479" r="11" fill="#f59e0b"/><text x="428" y="484" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">4</text><text x="448" y="484" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Pega la tapa, pon el pompón y</text><text x="448" y="503" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">presiona.</text><rect x="40" y="546" width="736" height="454" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="582" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="900" fill="#16a34a">¿POR QUÉ PASA?</text><text x="64" y="616" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">Al bajar el palito guardas energía elástica. Al soltarlo, esa</text><text x="64" y="643" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">energía se convierte en movimiento y lanza el pompón.</text>
