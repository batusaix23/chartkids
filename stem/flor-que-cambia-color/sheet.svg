16"  fill="#1e293b">Pon mucho colorante en el vaso</text><text x="448" y="359" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">con agua.</text><circle cx="428" cy="383" r="11" fill="#10b981"/><text x="428" y="388" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">2</text><text x="448" y="388" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Pide a un adulto que corte la</text><text x="448" y="407" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">punta del tallo.</text><circle cx="428" cy="431" r="11" fill="#10b981"/><text x="428" y="436" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">3</text><text x="448" y="436" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Mete la flor en el vaso.</text><circle cx="428" cy="460" r="11" fill="#10b981"/><text x="428" y="465" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">4</text><text x="448" y="465" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Revisa la flor durante 1 o 2</text><text x="448" y="484" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">días.</text><text x="40" y="533" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#10b981">MI PREDICCIÓN: ¿qué crees que va a pasar?</text><line x1="40" y1="563" x2="776" y2="563" stroke="#cbd5e1" stroke-width="1.5"/><line x1="40" y1="593" x2="776" y2="593" stroke="#cbd5e1" stroke-width="1.5"/><line x1="40" y1="623" x2="776" y2="623" stroke="#cbd5e1" stroke-width="1.5"/><text x="40" y="649" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#10b981">LO QUE OBSERVÉ: dibuja o escribe</text><rect x="40" y="661" width="736" height="331" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
