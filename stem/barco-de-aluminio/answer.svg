<rect x="40" y="216" width="736" height="70" rx="14" fill="#f59e0b18" stroke="#f59e0b" stroke-width="2"/><text x="70" y="264" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif" font-size="38">⛵</text><text x="122" y="244" font-family="'Nunito',Arial,sans-serif" font-size="14" font-weight="800" fill="#f59e0b" letter-spacing="1">INGENIERÍA</text><text x="122" y="268" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="800" fill="#1e293b">¿Cuántas monedas aguanta tu barco?</text><text x="40" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#f59e0b">MATERIALES</text><text x="418" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#f59e0b">PASOS</text><rect x="40" y="325" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Papel aluminio (20 × 20 cm)</text><rect x="40" y="352" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="367" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Una tina con agua</text><rect x="40" y="379" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="394" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Monedas</text><circle cx="428" cy="335" r="11" fill="#f59e0b"/><text x="428" y="340" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">1</text><text x="448" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Dobla el aluminio en forma de</text><text x="448" y="359" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">barco.</text><circle cx="428" cy="383" r="11" fill="#f59e0b"/><text x="428" y="388" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">2</text><text x="448" y="388" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Ponlo a flotar en el agua.</text><circle cx="428" cy="412" r="11" fill="#f59e0b"/><text x="428" y="417" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">3</text><text x="448" y="417" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Agrega monedas una por una.</text><circle cx="428" cy="441" r="11" fill="#f59e0b"/><text x="428" y="446" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">4</text><text x="448" y="446" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Cuenta cuántas aguanta antes de</text><text x="448" y="465" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">hundirse.</text><rect x="40" y="508" width="736" height="492" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="544" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="900" fill="#16a34a">¿POR QUÉ PASA?</text><text x="64" y="578" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">Un barco ancho desplaza más agua, y el agua lo empuja hacia</text><text x="64" y="605" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">arriba con más fuerza. Por eso los barcos grandes de acero</text><text x="64" y="632" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">pueden flotar.</text>
