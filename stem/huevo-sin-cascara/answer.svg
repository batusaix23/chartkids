<rect x="40" y="216" width="736" height="70" rx="14" fill="#10b98118" stroke="#10b981" stroke-width="2"/><text x="70" y="264" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif" font-size="38">🥚</text><text x="122" y="244" font-family="'Nunito',Arial,sans-serif" font-size="14" font-weight="800" fill="#10b981" letter-spacing="1">CIENCIA</text><text x="122" y="268" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="800" fill="#1e293b">¿Qué le hace el vinagre a la cáscara?</text><text x="40" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#10b981">MATERIALES</text><text x="418" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#10b981">PASOS</text><rect x="40" y="325" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">1 huevo crudo</text><rect x="40" y="352" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="367" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Vinagre</text><rect x="40" y="379" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="394" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un frasco con tapa</text><circle cx="428" cy="335" r="11" fill="#10b981"/><text x="428" y="340" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">1</text><text x="448" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Pon el huevo en el frasco.</text><circle cx="428" cy="364" r="11" fill="#10b981"/><text x="428" y="369" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">2</text><text x="448" y="369" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Cúbrelo con vinagre y tapa.</text><circle cx="428" cy="393" r="11" fill="#10b981"/><text x="428" y="398" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">3</text><text x="448" y="398" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Espera 2 días.</text><circle cx="428" cy="422" r="11" fill="#10b981"/><text x="428" y="427" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">4</text><text x="448" y="427" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Saca el huevo con cuidado y</text><text x="448" y="446" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">tócalo.</text><rect x="40" y="489" width="736" height="511" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="525" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="900" fill="#16a34a">¿POR QUÉ PASA?</text><text x="64" y="559" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">La cáscara está hecha de calcio. El vinagre la disuelve (por</text><text x="64" y="586" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">eso salen burbujas) y queda solo la piel del huevo, que es</text><text x="64" y="613" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">elástica como goma.</text>
