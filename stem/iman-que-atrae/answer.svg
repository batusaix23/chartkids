<rect x="40" y="216" width="736" height="70" rx="14" fill="#10b98118" stroke="#10b981" stroke-width="2"/><text x="70" y="264" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif" font-size="38">🧲</text><text x="122" y="244" font-family="'Nunito',Arial,sans-serif" font-size="14" font-weight="800" fill="#10b981" letter-spacing="1">CIENCIA</text><text x="122" y="268" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="800" fill="#1e293b">¿Qué cosas se pegan a un imán?</text><text x="40" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#10b981">MATERIALES</text><text x="418" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#10b981">PASOS</text><rect x="40" y="325" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un imán</text><rect x="40" y="352" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="367" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un clip</text><rect x="40" y="379" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="394" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Una moneda</text><rect x="40" y="406" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="421" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Una goma de borrar</text><rect x="40" y="433" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="448" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Una cuchara</text><rect x="40" y="460" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="475" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un trozo de papel</text><circle cx="428" cy="335" r="11" fill="#10b981"/><text x="428" y="340" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">1</text><text x="448" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Antes de probar, adivina qué</text><text x="448" y="359" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">cosas se pegarán.</text><circle cx="428" cy="383" r="11" fill="#10b981"/><text x="428" y="388" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">2</text><text x="448" y="388" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Acerca el imán a cada objeto.</text><circle cx="428" cy="412" r="11" fill="#10b981"/><text x="428" y="417" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">3</text><text x="448" y="417" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Separa los objetos en dos</text><text x="448" y="436" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">grupos: sí y no.</text><circle cx="428" cy="460" r="11" fill="#10b981"/><text x="428" y="465" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">4</text><text x="448" y="465" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Compara tu respuesta con tu</text><text x="448" y="484" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">predicción.</text><rect x="40" y="527" width="736" height="473" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="563" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="900" fill="#16a34a">¿POR QUÉ PASA?</text><text x="64" y="597" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">Los imanes atraen objetos que tienen hierro, como los clips.</text><text x="64" y="624" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">El papel, el plástico o la goma no tienen hierro, por eso el</text><text x="64" y="651" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">imán no los atrae.</text>
