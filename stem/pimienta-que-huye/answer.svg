<rect x="40" y="216" width="736" height="70" rx="14" fill="#10b98118" stroke="#10b981" stroke-width="2"/><text x="70" y="264" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif" font-size="38">🧂</text><text x="122" y="244" font-family="'Nunito',Arial,sans-serif" font-size="14" font-weight="800" fill="#10b981" letter-spacing="1">CIENCIA</text><text x="122" y="268" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="800" fill="#1e293b">¿Qué hace el jabón con el agua?</text><text x="40" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#10b981">MATERIALES</text><text x="418" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#10b981">PASOS</text><rect x="40" y="325" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un plato hondo con agua</text><rect x="40" y="352" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="367" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Pimienta molida</text><rect x="40" y="379" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="394" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Jabón líquido</text><rect x="40" y="406" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="421" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un cotonete</text><circle cx="428" cy="335" r="11" fill="#10b981"/><text x="428" y="340" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">1</text><text x="448" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Espolvorea pimienta sobre el</text><text x="448" y="359" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">agua.</text><circle cx="428" cy="383" r="11" fill="#10b981"/><text x="428" y="388" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">2</text><text x="448" y="388" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Moja la punta del cotonete en</text><text x="448" y="407" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">jabón.</text><circle cx="428" cy="431" r="11" fill="#10b981"/><text x="428" y="436" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">3</text><text x="448" y="436" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Toca el centro del agua con el</text><text x="448" y="455" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">cotonete.</text><circle cx="428" cy="479" r="11" fill="#10b981"/><text x="428" y="484" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">4</text><text x="448" y="484" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Observa hacia dónde se mueve la</text><text x="448" y="503" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">pimienta.</text><rect x="40" y="546" width="736" height="454" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="582" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="900" fill="#16a34a">¿POR QUÉ PASA?</text><text x="64" y="616" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">El agua tiene una &quot;piel&quot; llamada tensión superficial. El jabón</text><text x="64" y="643" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">la rompe en el centro y la piel que queda tira hacia las</text><text x="64" y="670" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">orillas, llevándose la pimienta.</text>
