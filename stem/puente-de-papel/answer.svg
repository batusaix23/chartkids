<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1056" width="816" height="1056">
<rect width="816" height="1056" fill="#fff"/>
<rect x="24" y="24" width="768" height="112" rx="18" fill="#10b981"/>
<text x="408" y="56" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="14" font-weight="800" fill="#fff" opacity=".9" letter-spacing="1.5">¿POR QUÉ PASA?</text>
<text x="408" y="94" text-anchor="middle" font-family="'Fredoka One','Nunito',Arial,sans-serif" font-size="34" fill="#fff">Puente de papel</text>
<text x="408" y="122" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="16" font-weight="700" fill="#fff" opacity=".95">La explicación científica</text>
<text x="40" y="176" font-family="'Nunito',Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">Nombre: ______________________________</text>
<text x="776" y="176" text-anchor="end" font-family="'Nunito',Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">Fecha: ______________</text>
<rect x="40" y="216" width="736" height="70" rx="14" fill="#f59e0b18" stroke="#f59e0b" stroke-width="2"/><text x="70" y="264" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif" font-size="38">🌉</text><text x="122" y="244" font-family="'Nunito',Arial,sans-serif" font-size="14" font-weight="800" fill="#f59e0b" letter-spacing="1">INGENIERÍA</text><text x="122" y="268" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="800" fill="#1e293b">¿Qué forma hace más fuerte un puente de papel?</text><text x="40" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#f59e0b">MATERIALES</text><text x="418" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#f59e0b">PASOS</text><rect x="40" y="325" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">3 hojas de papel</text><rect x="40" y="352" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="367" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">2 libros iguales</text><rect x="40" y="379" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="394" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Monedas</text><circle cx="428" cy="335" r="11" fill="#f59e0b"/><text x="428" y="340" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">1</text><text x="448" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Pon los libros separados 15 cm.</text><circle cx="428" cy="364" r="11" fill="#f59e0b"/><text x="428" y="369" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">2</text><text x="448" y="369" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Coloca una hoja plana como</text><text x="448" y="388" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">puente y pon monedas.</text><circle cx="428" cy="412" r="11" fill="#f59e0b"/><text x="428" y="417" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">3</text><text x="448" y="417" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Dobla otra hoja en acordeón y</text><text x="448" y="436" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">prueba de nuevo.</text><circle cx="428" cy="460" r="11" fill="#f59e0b"/><text x="428" y="465" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">4</text><text x="448" y="465" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Cuenta cuántas monedas aguanta</text><text x="448" y="484" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">cada forma.</text><rect x="40" y="527" width="736" height="473" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="563" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="900" fill="#16a34a">¿POR QUÉ PASA?</text><text x="64" y="597" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">Al doblar el papel en acordeón, el peso se reparte y el papel</text><text x="64" y="624" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">no se dobla fácil. Muchos puentes reales usan formas así para</text><text x="64" y="651" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">ser más fuertes.</text>
<text x="408" y="1028" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" fill="#94a3b8">Imprimible gratis · chartkids.com</text>
