<rect x="40" y="216" width="736" height="70" rx="14" fill="#f59e0b18" stroke="#f59e0b" stroke-width="2"/><text x="70" y="264" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif" font-size="38">🪂</text><text x="122" y="244" font-family="'Nunito',Arial,sans-serif" font-size="14" font-weight="800" fill="#f59e0b" letter-spacing="1">INGENIERÍA</text><text x="122" y="268" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="800" fill="#1e293b">¿Qué paracaídas cae más despacio?</text><text x="40" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#f59e0b">MATERIALES</text><text x="418" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#f59e0b">PASOS</text><rect x="40" y="325" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Bolsa de plástico</text><rect x="40" y="352" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="367" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Hilo</text><rect x="40" y="379" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="394" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un muñequito pequeño</text><rect x="40" y="406" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="421" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Tijeras</text><rect x="40" y="433" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="448" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un reloj</text><circle cx="428" cy="335" r="11" fill="#f59e0b"/><text x="428" y="340" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">1</text><text x="448" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Corta un cuadrado de la bolsa.</text><circle cx="428" cy="364" r="11" fill="#f59e0b"/><text x="428" y="369" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">2</text><text x="448" y="369" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Amarra un hilo en cada esquina.</text><circle cx="428" cy="393" r="11" fill="#f59e0b"/><text x="428" y="398" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">3</text><text x="448" y="398" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Une los hilos al muñeco.</text><circle cx="428" cy="422" r="11" fill="#f59e0b"/><text x="428" y="427" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">4</text><text x="448" y="427" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Suéltalo desde lo alto y mide</text><text x="448" y="446" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">cuánto tarda en caer.</text><rect x="40" y="489" width="736" height="511" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="525" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="900" fill="#16a34a">¿POR QUÉ PASA?</text><text x="64" y="559" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">El paracaídas atrapa mucho aire. El aire frena la caída</text><text x="64" y="586" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">(resistencia del aire). Un paracaídas más grande cae más</text><text x="64" y="613" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">lento.</text>
