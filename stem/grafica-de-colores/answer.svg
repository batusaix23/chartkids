="16"  fill="#1e293b">Cuenta cuántos hay de cada</text><text x="448" y="388" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">color.</text><circle cx="428" cy="412" r="11" fill="#a855f7"/><text x="428" y="417" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">3</text><text x="448" y="417" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Pinta un cuadrito por cada dulce</text><text x="448" y="436" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">en la gráfica.</text><circle cx="428" cy="460" r="11" fill="#a855f7"/><text x="428" y="465" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">4</text><text x="448" y="465" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">¿Qué color ganó?</text><rect x="40" y="508" width="736" height="492" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="544" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="900" fill="#16a34a">¿POR QUÉ PASA?</text><text x="64" y="578" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">Una gráfica de barras ayuda a comparar cantidades con solo</text><text x="64" y="605" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">mirarla. La barra más alta es el color que más hay.</text>
