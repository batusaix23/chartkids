<rect x="40" y="216" width="736" height="70" rx="14" fill="#10b98118" stroke="#10b981" stroke-width="2"/><text x="70" y="264" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif" font-size="38">✏️</text><text x="122" y="244" font-family="'Nunito',Arial,sans-serif" font-size="14" font-weight="800" fill="#10b981" letter-spacing="1">CIENCIA</text><text x="122" y="268" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="800" fill="#1e293b">¿Por qué el lápiz parece roto en el agua?</text><text x="40" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#10b981">MATERIALES</text><text x="418" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#10b981">PASOS</text><rect x="40" y="325" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un vaso transparente</text><rect x="40" y="352" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="367" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Agua</text><rect x="40" y="379" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="394" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un lápiz</text><circle cx="428" cy="335" r="11" fill="#10b981"/><text x="428" y="340" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">1</text><text x="448" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Llena el vaso con agua.</text><circle cx="428" cy="364" r="11" fill="#10b981"/><text x="428" y="369" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">2</text><text x="448" y="369" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Mete el lápiz inclinado.</text><circle cx="428" cy="393" r="11" fill="#10b981"/><text x="428" y="398" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">3</text><text x="448" y="398" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Míralo de lado, a la altura del</text><text x="448" y="417" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">agua.</text><circle cx="428" cy="441" r="11" fill="#10b981"/><text x="428" y="446" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">4</text><text x="448" y="446" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Saca el lápiz: ¿está roto?</text><rect x="40" y="489" width="736" height="511" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="525" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="900" fill="#16a34a">¿POR QUÉ PASA?</text><text x="64" y="559" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">La luz cambia de dirección cuando pasa del aire al agua</text><text x="64" y="586" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">(refracción). Por eso vemos el lápiz como si estuviera</text><text x="64" y="613" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">partido, aunque está entero.</text>
