 fill="#fff">2</text><text x="448" y="388" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Pide a un adulto que lo mida con</text><text x="448" y="407" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">sus pasos.</text><circle cx="428" cy="431" r="11" fill="#a855f7"/><text x="428" y="436" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">3</text><text x="448" y="436" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Compara los números.</text><circle cx="428" cy="460" r="11" fill="#a855f7"/><text x="428" y="465" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">4</text><text x="448" y="465" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Mídelo con la cinta métrica.</text><rect x="40" y="508" width="736" height="492" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="544" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="900" fill="#16a34a">¿POR QUÉ PASA?</text><text x="64" y="578" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">Los pasos de cada persona son distintos, por eso los</text><text x="64" y="605" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">resultados cambian. Usamos el metro porque es una medida igual</text><text x="64" y="632" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">para todos.</text>
