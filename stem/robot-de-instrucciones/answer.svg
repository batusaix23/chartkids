<rect x="40" y="216" width="736" height="70" rx="14" fill="#0ea5e918" stroke="#0ea5e9" stroke-width="2"/><text x="70" y="264" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif" font-size="38">🤖</text><text x="122" y="244" font-family="'Nunito',Arial,sans-serif" font-size="14" font-weight="800" fill="#0ea5e9" letter-spacing="1">TECNOLOGÍA</text><text x="122" y="268" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="800" fill="#1e293b">¿Qué tan exactas deben ser las instrucciones?</text><text x="40" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#0ea5e9">MATERIALES</text><text x="418" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#0ea5e9">PASOS</text><rect x="40" y="325" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Papel</text><rect x="40" y="352" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="367" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Lápiz</text><rect x="40" y="379" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="394" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un adulto que haga de robot</text><rect x="40" y="406" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="421" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un juguete escondido</text><circle cx="428" cy="335" r="11" fill="#0ea5e9"/><text x="428" y="340" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">1</text><text x="448" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Esconde un juguete en el cuarto.</text><circle cx="428" cy="364" r="11" fill="#0ea5e9"/><text x="428" y="369" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">2</text><text x="448" y="369" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Escribe pasos exactos: &quot;avanza 2</text><text x="448" y="388" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">pasos&quot;, &quot;gira a la derecha&quot;.</text><circle cx="428" cy="412" r="11" fill="#0ea5e9"/><text x="428" y="417" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">3</text><text x="448" y="417" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">El &quot;robot&quot; sigue solo tus pasos,</text><text x="448" y="436" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">sin adivinar.</text><circle cx="428" cy="460" r="11" fill="#0ea5e9"/><text x="428" y="465" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">4</text><text x="448" y="465" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Corrige el programa hasta que</text><text x="448" y="484" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">encuentre el juguete.</text><rect x="40" y="527" width="736" height="473" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="563" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="900" fill="#16a34a">¿POR QUÉ PASA?</text><text x="64" y="597" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">Las computadoras hacen exactamente lo que dice el programa. Si</text><text x="64" y="624" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">falta un paso, se equivocan. Encontrar y corregir errores se</text><text x="64" y="651" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">llama depurar.</text>
