="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">3</text><text x="448" y="417" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Repite 36 veces.</text><circle cx="428" cy="441" r="11" fill="#a855f7"/><text x="428" y="446" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">4</text><text x="448" y="446" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">¿Qué número salió más veces?</text><rect x="40" y="489" width="736" height="511" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="525" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="900" fill="#16a34a">¿POR QUÉ PASA?</text><text x="64" y="559" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">El 7 es la suma más probable porque se puede formar de 6</text><text x="64" y="586" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">maneras (1+6, 2+5, 3+4…). El 2 y el 12 solo salen de una</text><text x="64" y="613" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">manera.</text>
