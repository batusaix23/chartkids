<rect x="40" y="216" width="736" height="70" rx="14" fill="#a855f718" stroke="#a855f7" stroke-width="2"/><text x="70" y="264" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif" font-size="38">🕰️</text><text x="122" y="244" font-family="'Nunito',Arial,sans-serif" font-size="14" font-weight="800" fill="#a855f7" letter-spacing="1">MATEMÁTICAS</text><text x="122" y="268" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="800" fill="#1e293b">¿Podemos saber la hora con el Sol?</text><text x="40" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#a855f7">MATERIALES</text><text x="418" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#a855f7">PASOS</text><rect x="40" y="325" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un plato de cartón</text><rect x="40" y="352" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="367" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un lápiz</text><rect x="40" y="379" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="394" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Plastilina</text><rect x="40" y="406" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="421" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un marcador</text><rect x="40" y="433" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="448" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un reloj</text><circle cx="428" cy="335" r="11" fill="#a855f7"/><text x="428" y="340" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">1</text><text x="448" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Pega el lápiz parado en el</text><text x="448" y="359" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">centro del plato.</text><circle cx="428" cy="383" r="11" fill="#a855f7"/><text x="428" y="388" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">2</text><text x="448" y="388" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Pon el plato al sol a las 9 en</text><text x="448" y="407" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">punto.</text><circle cx="428" cy="431" r="11" fill="#a855f7"/><text x="428" y="436" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">3</text><text x="448" y="436" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Marca la sombra y escribe &quot;9&quot;.</text><circle cx="428" cy="460" r="11" fill="#a855f7"/><text x="428" y="465" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">4</text><text x="448" y="465" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Repite cada hora hasta las 4.</text><rect x="40" y="508" width="736" height="492" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="544" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="900" fill="#16a34a">¿POR QUÉ PASA?</text><text x="64" y="578" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">Al girar la Tierra, la sombra del lápiz se mueve como una</text><text x="64" y="605" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">manecilla. Así medían el tiempo hace miles de años.</text>
