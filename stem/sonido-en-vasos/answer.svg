<rect x="40" y="216" width="736" height="70" rx="14" fill="#0ea5e918" stroke="#0ea5e9" stroke-width="2"/><text x="70" y="264" font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif" font-size="38">📞</text><text x="122" y="244" font-family="'Nunito',Arial,sans-serif" font-size="14" font-weight="800" fill="#0ea5e9" letter-spacing="1">TECNOLOGÍA</text><text x="122" y="268" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="800" fill="#1e293b">¿El sonido puede viajar por un hilo?</text><text x="40" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#0ea5e9">MATERIALES</text><text x="418" y="312" font-family="'Nunito',Arial,sans-serif" font-size="18" font-weight="900" fill="#0ea5e9">PASOS</text><rect x="40" y="325" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">2 vasos de papel</text><rect x="40" y="352" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="367" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un hilo de 3 metros</text><rect x="40" y="379" width="16" height="16" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="66" y="394" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Un lápiz</text><circle cx="428" cy="335" r="11" fill="#0ea5e9"/><text x="428" y="340" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">1</text><text x="448" y="340" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Haz un agujero en el fondo de</text><text x="448" y="359" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">cada vaso con el lápiz.</text><circle cx="428" cy="383" r="11" fill="#0ea5e9"/><text x="428" y="388" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">2</text><text x="448" y="388" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Pasa el hilo y haz un nudo</text><text x="448" y="407" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">dentro de cada vaso.</text><circle cx="428" cy="431" r="11" fill="#0ea5e9"/><text x="428" y="436" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">3</text><text x="448" y="436" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Aléjate hasta que el hilo quede</text><text x="448" y="455" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">tenso.</text><circle cx="428" cy="479" r="11" fill="#0ea5e9"/><text x="428" y="484" text-anchor="middle" font-family="'Nunito',Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">4</text><text x="448" y="484" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">Uno habla en un vaso y el otro</text><text x="448" y="503" font-family="'Nunito',Arial,sans-serif" font-size="16"  fill="#1e293b">escucha.</text><rect x="40" y="546" width="736" height="454" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="582" font-family="'Nunito',Arial,sans-serif" font-size="20" font-weight="900" fill="#16a34a">¿POR QUÉ PASA?</text><text x="64" y="616" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">Al hablar, el vaso vibra. La vibración viaja por el hilo tenso</text><text x="64" y="643" font-family="'Nunito',Arial,sans-serif" font-size="19"  fill="#1e293b">hasta el otro vaso, que vuelve a vibrar y produce el sonido.</text>
