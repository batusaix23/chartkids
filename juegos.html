<style>
:root{--bg:#0f0f1a;--surface:#1a1a2e;--surface2:#232340;--border:#2e2e50;--text:#f1f5f9;--muted:#94a3b8;--accent:#7c3aed;--pink:#ec4899}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 60px}
.hero{text-align:center;padding:30px 0 10px}
.hero h1{font-family:'Fredoka One',cursive;font-size:clamp(1.9rem,5vw,2.7rem);margin:6px 0;background:linear-gradient(135deg,#a78bfa,#f472b6,#fbbf24);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);font-weight:700;margin:0 auto;max-width:560px}
.jg-print{text-align:center;font-weight:800;font-size:.88rem;margin:-8px 0 18px;color:#64748b}
.jg-print a{color:#a78bfa;text-decoration:none}
.jg-stats{text-align:center;font-weight:800;color:#fde68a;margin:12px 0 18px}
.jg-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.jg-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:20px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:'Nunito',sans-serif;cursor:pointer;transition:transform .15s,border-color .15s}
.jg-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.jg-ic{font-size:2.8rem}
.jg-card b{font-size:1.1rem}
.jg-card small{color:var(--muted);font-weight:700;text-align:center}
.jg-best{display:flex;gap:8px;margin-top:6px;color:#fbbf24;font-size:.8rem}
.jg-best i{font-style:normal;letter-spacing:-1px}
.jg-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.jg-head b{font-size:1.2rem;flex:1}
.jg-back{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:1.2rem;cursor:pointer}
.jg-levels{display:flex;gap:6px}
.jg-lv{padding:7px 13px;border-radius:50px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font:800 .85rem 'Nunito',sans-serif;cursor:pointer}
.jg-lv.on{background:linear-gradient(135deg,var(--accent),var(--pink));color:#fff;border-color:transparent}
.jg-info{color:var(--muted);font-weight:800;font-size:.9rem;margin-bottom:12px;min-height:1.2em}
.jg-memo{display:grid;gap:10px;max-width:560px;margin:0 auto}
.jg-mc{aspect-ratio:1;border-radius:16px;border:none;background:linear-gradient(135deg,#7c3aed,#ec4899);cursor:pointer;font-size:clamp(1.8rem,7vw,2.8rem);position:relative;transition:background .25s;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.jg-mc::before{content:'?';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);font-family:'Fredoka One',cursive}
.jg-mc span{opacity:0;transition:opacity .2s}
.jg-mc.open{background:#fffaf3}
.jg-mc.open::before{content:''}
.jg-mc.open span{opacity:1}
.jg-mc.done{background:#dcfce7;box-shadow:0 0 0 3px #22c55e}
.jg-seq{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0 16px}
.jg-seq span{min-width:54px;height:54px;padding:0 8px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--surface);border:1px solid var(--border);font-size:1.7rem;font-weight:900}
.jg-seq .jg-q{border:2px dashed #fbbf24;color:#fbbf24}
.jg-ask{text-align:center;font-weight:900;font-size:1.05rem;margin-bottom:10px}
.jg-opts{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.jg-opt{min-width:72px;height:64px;padding:0 12px;border-radius:16px;border:2px solid var(--border);background:var(--surface2);color:var(--text);font:900 1.7rem 'Nunito',sans-serif;cursor:pointer}
.jg-opt.ok{border-color:#22c55e;background:rgba(34,197,94,.2)}
.jg-opt.no{border-color:#ef4444;background:rgba(239,68,68,.2)}
.jg-sud{display:grid;max-width:min(460px,100%);margin:0 auto;border:3px solid #a78bfa;border-radius:10px;overflow:hidden;background:#fffaf3}
.jg-cell{aspect-ratio:1;border:1px solid #d8cff0;background:#fffaf3;color:#4c1d95;font:900 1.4rem 'Nunito',sans-serif;cursor:pointer;padding:0}
.jg-sud4 .jg-cell{font-size:2rem}
.jg-sud9 .jg-cell{font-size:1.05rem}
.jg-cell.given{background:#ede9fe;color:#1e1b4b;cursor:default}
.jg-cell.br{border-right:3px solid #a78bfa}
.jg-cell.bb{border-bottom:3px solid #a78bfa}
.jg-cell.sel{background:#fde68a}
.jg-cell.shake{animation:jgShake .35s;background:#fecaca}
@keyframes jgShake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.jg-pal{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.jg-sym{min-width:52px;height:52px;border-radius:14px;border:2px solid var(--border);background:var(--surface2);color:var(--text);font:900 1.4rem 'Nunito',sans-serif;cursor:pointer}
.jg-erase{font-size:.9rem;padding:0 12px}
.jg-simon{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:340px;margin:0 auto 14px}
.jg-simon6{grid-template-columns:repeat(3,1fr);max-width:420px}
.jg-pad{aspect-ratio:1;border-radius:24px;border:none;background:var(--c);opacity:.45;cursor:pointer;transition:opacity .1s,transform .1s;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.jg-pad.lit{opacity:1;transform:scale(1.05);box-shadow:0 0 30px var(--c)}
.jg-objs{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:10px auto 18px;max-width:520px}
.jg-objs span{width:76px;height:76px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.jg-objs .jg-gap{border:2px dashed #fbbf24;color:#fbbf24;font-weight:900}
.jg-sum{text-align:center;font-family:'Fredoka One',cursive;font-size:clamp(2.2rem,8vw,3.2rem);margin:8px 0 16px}
.jg-big .jg-opt{min-width:84px;height:84px;font-size:2.4rem}
.jg-why{text-align:center;font-weight:800;color:#fde68a;margin-top:12px;min-height:1.4em}
.jg-hint{text-align:center;font-size:3rem;line-height:1}
.jg-hint small{display:block;font-size:.8rem;color:var(--muted);font-weight:800}
.jg-balloons{display:flex;justify-content:center;gap:6px;font-size:1.6rem;margin:8px 0}
.jg-balloons .pop{opacity:.5}
.jg-word{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.jg-word span{width:42px;height:52px;border-bottom:4px solid #a78bfa;display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;font-size:1.9rem}
.jg-keys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:560px;margin:0 auto}
.jg-key{width:42px;height:46px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font:900 1.1rem 'Nunito',sans-serif;cursor:pointer}
.jg-key.ok{background:rgba(34,197,94,.3);border-color:#22c55e}
.jg-key.no{background:rgba(239,68,68,.25);border-color:#ef4444}
.jg-key:disabled{cursor:default;opacity:.75}
.jg-link{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);max-width:min(440px,100%);margin:0 auto;aspect-ratio:1;border:3px solid #4c1d95;border-radius:12px;overflow:hidden;background:#fffaf3;touch-action:none;user-select:none}
.jg-lc{border:1px solid #e2d9f3;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.jg-dot{width:62%;height:62%;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.25);position:relative;z-index:3}
.jg-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.jg-shape{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;max-width:min(400px,100%);margin:0 auto;aspect-ratio:1}
.jg-sc{border-radius:6px}
.jg-sc.slot{background:#2e2e50;outline:2px dashed #4c4c80;outline-offset:-2px;cursor:pointer}
.jg-sc.hov-ok{box-shadow:inset 0 0 0 3px #22c55e}
.jg-sc.hov-no{box-shadow:inset 0 0 0 3px #ef4444}
.jg-tray-bar{text-align:center;margin:14px 0 8px}
.jg-tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:60px}
.jg-piece{padding:8px;border-radius:14px;border:2px solid #2e2e50;background:#1a1a2e;cursor:pointer}
.jg-piece.on{border-color:#fbbf24;box-shadow:0 0 12px rgba(251,191,36,.6)}
.jg-result{margin:20px auto 0;max-width:460px;text-align:center;padding:20px;border-radius:22px;background:linear-gradient(180deg,#fff7e6,#fdf2ff);color:#3b2a5a}
.jg-result>b{font-family:'Fredoka One',cursive;font-size:1.4rem;color:#6d28d9;display:block}
.jg-result p{font-weight:700;margin:4px 0 12px}
.jg-stars{font-size:2.6rem;letter-spacing:6px;color:#e5e7eb}
.jg-stars .on{color:#f59e0b;text-shadow:0 2px 8px rgba(245,158,11,.5)}
.jg-sticker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:#fff;border:2px solid #fde68a;border-radius:16px;padding:10px;margin-bottom:12px;text-align:left}
.jg-sticker>span{font-size:2.4rem}
.jg-sticker b{display:block;color:#4c1d95}
.jg-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.jg-btn{padding:11px 18px;border-radius:50px;border:none;background:linear-gradient(135deg,var(--accent),var(--pink));color:#fff;font:900 .95rem 'Nunito',sans-serif;cursor:pointer}
.jg-sec{background:#fff;color:#4c1d95;border:2px solid #e9d5ff}
.ck-footer{border-top:1px solid #2e2e50;margin-top:48px;padding:26px 16px 34px;text-align:center;color:#94a3b8;font-size:.86rem;line-height:1.9}
.ck-footer a{color:#a78bfa;text-decoration:none;margin:0 8px;font-weight:700}
@media (prefers-reduced-motion:reduce){.jg-mc,.jg-cell.shake{transition:none;animation:none}}
</style>
