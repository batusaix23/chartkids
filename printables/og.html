<!DOCTYPE html>
<!-- printables/og.html — layout for the share image (og.jpg) of one printable.
     Rendered by printables/build-og.js with headless Edge at 1000×525:
     og.html?sheet=/maze/lion-maze-maze/sheet.svg&title=…&cat=…&color=%237c3aed&emoji=🌀 -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1000px;height:525px;overflow:hidden}
  body{font-family:'Nunito',sans-serif;background:#0f0f1a;display:flex;align-items:center;gap:44px;padding:0 48px 0 40px;position:relative}
  body::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,var(--c) 0,transparent 55%);opacity:.35}
  .sheet{position:relative;flex:0 0 auto;height:465px;aspect-ratio:816/1056;background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.55);overflow:hidden;transform:rotate(-2.5deg)}
  .sheet img{width:100%;height:100%;object-fit:contain;display:block}
  .text{position:relative;flex:1;color:#f1f5f9}
  .cat{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:22px;color:#fff;background:var(--c);padding:7px 18px;border-radius:50px;margin-bottom:22px}
  h1{font-family:'Fredoka One',cursive;font-size:50px;line-height:1.08;margin-bottom:20px}
  .free{font-size:25px;font-weight:800;color:#cbd5e1;margin-bottom:34px}
  .brand{font-family:'Fredoka One',cursive;font-size:36px;background:linear-gradient(135deg,#7c3aed,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand span{color:#fbbf24;-webkit-text-fill-color:#fbbf24}
</style>
</head>
<body>
<div class="sheet"><img id="sheet" alt=""></div>
<div class="text">
  <div class="cat" id="cat"></div>
  <h1 id="title"></h1>
  <div class="free">🖨️ Gratis para imprimir</div>
  <div class="brand">Chart<span>Kids</span> ✨</div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.documentElement.style.setProperty('--c', q.get('color') || '#7c3aed');
  document.getElementById('sheet').src = q.get('sheet');
  document.getElementById('cat').textContent = (q.get('emoji') || '') + ' ' + (q.get('cat') || '');
  const t = q.get('title') || '';
  const h = document.getElementById('title');
  h.textContent = t;
  if (t.length > 34) h.style.fontSize = '40px';
  if (t.length > 52) h.style.fontSize = '34px';
</script>
</body>
</html>
